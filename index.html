<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Metas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Minhas Metas</h1>
    <p class="nome">Maria Julia Faot</p>
</header>

<main>

    <section class="goal">
        <div class="left">
            <h2>🎓 Ensino Médio</h2>
            <p>Concluir até 2026</p>
        </div>
        <div class="right">
            <div id="timer1" class="timer"></div>
            <div id="percent1" class="percent"></div>
            <div class="progress-container">
                <div id="progress1" class="progress-bar"></div>
            </div>
        </div>
    </section>

    <section class="goal">
        <div class="left">
            <h2>📚 Curso de Inglês</h2>
            <p>Concluir até o final de 2026</p>
        </div>
        <div class="right">
            <div id="timer2" class="timer"></div>
            <div id="percent2" class="percent"></div>
            <div class="progress-container">
                <div id="progress2" class="progress-bar"></div>
            </div>
        </div>
    </section>

    <section class="goal">
        <div class="left">
            <h2>🏫 Faculdade</h2>
            <p>Passar até 2027</p>
        </div>
        <div class="right">
            <div id="timer3" class="timer"></div>
            <div id="percent3" class="percent"></div>
            <div class="progress-container">
                <div id="progress3" class="progress-bar"></div>
            </div>
        </div>
    </section>

    <section class="goal">
        <div class="left">
            <h2>🏭 Trabalhar na Volvo</h2>
            <p>Até metade de 2028</p>
        </div>
        <div class="right">
            <div id="timer4" class="timer"></div>
            <div id="percent4" class="percent"></div>
            <div class="progress-container">
                <div id="progress4" class="progress-bar"></div>
            </div>
        </div>
    </section>

    <section class="goal">
        <div class="left">
            <h2>✈️ Viagem para Houston</h2>
            <p>Junho-Agosto 2027 </p>
        </div>
        <div class="right">
            <div id="timer5" class="timer"></div>
            <div id="percent5" class="percent"></div>
            <div class="progress-container">
                <div id="progress5" class="progress-bar"></div>
            </div>
        </div>
    </section>

</main>

<footer>
    <p>© 2026 Maria Julia Faot</p>
</footer>

<script src="script.js"></script>

</body>
</html>
